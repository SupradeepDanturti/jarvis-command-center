<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b11"><meta name="color-scheme" content="dark">
  <title>G16 · Command Center</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/surface.css?v=20261003-tablet"><script src="/static/icons.js" defer></script><script src="/static/screens.js" defer></script><script src="/static/games.js" defer></script><script src="/static/display.js" defer></script><script src="/static/app.js?v=20261003-tablet" defer></script>
</head>
<body>
  <header class="surface-bar"><a href="#home" class="surface-brand" aria-label="G16 home"><img src="/static/assets/g16-mark.svg" width="27" height="27" alt=""><span>G16<span class="brand-slash"> /</span></span></a><div class="surface-status"><span id="connection" class="status">● PAIR DEVICE</span><time id="clock"></time><button id="fullscreen" aria-label="Toggle fullscreen"><span data-icon="fullscreen"></span></button></div></header>
  <div id="surface-navigation" class="surface-navigation">
    <div id="more-menu" class="more-menu" hidden><span class="menu-label">A CLOSER LOOK</span><button class="nav" data-page="hardware"><span data-icon="hardware"></span>Hardware</button><button class="nav" data-page="graphs"><span data-icon="graphs"></span>Live graphs</button><button class="nav" data-page="system"><span data-icon="system"></span>System & controls</button><button class="nav" data-page="devices"><span data-icon="devices"></span>Device access</button></div>
    <nav class="surface-dock" aria-label="Display screens">
      <button class="nav active" data-page="home" aria-label="Home"><span data-icon="home"></span><small>Home</small></button>
      <button class="nav" data-page="gaming" aria-label="Performance"><span data-icon="hardware"></span><small>Live</small></button>
      <button class="nav" data-page="games" aria-label="Games"><span data-icon="gaming"></span><small>Games</small></button>
      <button class="nav" data-page="apps" aria-label="Apps"><span data-icon="apps"></span><small>Apps</small></button>
      <button class="nav" data-page="clock" aria-label="Clock"><span data-icon="clock"></span><small>Clock</small></button>
      <button class="nav" data-page="ambient" aria-label="Ambient"><span data-icon="ambient"></span><small>Ambient</small></button>
      <button id="more-toggle" aria-label="More screens" aria-controls="more-menu" aria-expanded="false"><span data-icon="system"></span><small>More</small></button>
    </nav>
  </div>
  <main>
    <div class="surface-header"><h1 id="page-title">Command center</h1><p id="page-description">Your laptop. Everything in view.</p></div>
    <div hidden><strong id="hostname">DELL G16</strong><span id="system-summary"></span><span id="sample-age"></span><span id="footer-ip"></span></div>
    <div id="offline-banner" class="notice" hidden>Connection interrupted. Reconnecting automatically; readings below are stale.</div>
    <section id="page-content" aria-label="Desk display"></section>
  </main>
  <dialog id="pair-dialog"><form id="pair-form"><div class="dialog-mark"><img src="/static/assets/g16-mark.svg" width="44" height="44" alt="">G16</div><div class="eyebrow">PRIVATE DEVICE ACCESS</div><h2 id="pair-title">Approve this browser.</h2><p id="pair-description">Checking your device…</p><label for="device-name">DEVICE NAME</label><input id="device-name" name="device" maxlength="60" autocomplete="off" placeholder="Redmi Pad Pro" required><div id="setup-code" hidden><label for="pair-code">LAPTOP SETUP CODE</label><input id="pair-code" name="code" minlength="8" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A1B2C3D4"></div><button class="primary" type="submit">Request approval <span>→</span></button><p id="pair-error" role="alert"></p><small id="pair-note">Only approved browsers can see or control your laptop.</small></form></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
